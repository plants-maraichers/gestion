# (donné après "wrangler kv namespace create DATA_KV", ou visible
# dans le tableau de bord Cloudflare > Workers & Pages > KV).
[[kv_namespaces]]
binding = "DATA_KV"
id = "PLACEHOLDER_REMPLACE_MOI"